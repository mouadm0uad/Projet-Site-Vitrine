<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" width="600" height="460" role="img" aria-label="Illustration d'un chat et d'un chien devant la maison du refuge">
  <circle cx="300" cy="230" r="215" fill="#2C5940"/>
  <circle cx="120" cy="100" r="4" fill="#E8B04B"/>
  <circle cx="480" cy="130" r="3" fill="#F6F1E7"/>
  <circle cx="440" cy="70" r="4" fill="#E8B04B"/>
  <circle cx="150" cy="180" r="3" fill="#F6F1E7"/>

  <!-- maison du refuge -->
  <path d="M180 220 L300 140 L420 220 Z" fill="#E8B04B" stroke="#12291C" stroke-width="6" stroke-linejoin="round"/>
  <rect x="205" y="220" width="190" height="150" fill="#F6F1E7" stroke="#12291C" stroke-width="6"/>
  <rect x="275" y="285" width="50" height="85" fill="#2C5940" stroke="#12291C" stroke-width="5"/>
  <circle cx="300" cy="200" r="16" fill="#D9705F" stroke="#12291C" stroke-width="5"/>

  <!-- chien a gauche -->
  <g>
    <ellipse cx="140" cy="345" rx="42" ry="30" fill="#C98A46" stroke="#12291C" stroke-width="5"/>
    <circle cx="112" cy="300" r="27" fill="#C98A46" stroke="#12291C" stroke-width="5"/>
    <path d="M92 282 L84 258 L106 272 Z" fill="#C98A46" stroke="#12291C" stroke-width="5" stroke-linejoin="round"/>
    <path d="M130 280 L142 258 L146 282 Z" fill="#C98A46" stroke="#12291C" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="104" cy="298" r="3.5" fill="#12291C"/>
    <circle cx="120" cy="298" r="3.5" fill="#12291C"/>
    <ellipse cx="112" cy="310" rx="6" ry="4.5" fill="#12291C"/>
    <path d="M178 330 Q198 312, 190 292" stroke="#12291C" stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>

  <!-- chat a droite -->
  <g>
    <ellipse cx="458" cy="350" rx="34" ry="26" fill="#8FA8A0" stroke="#12291C" stroke-width="5"/>
    <circle cx="482" cy="310" r="24" fill="#8FA8A0" stroke="#12291C" stroke-width="5"/>
    <path d="M464 293 L462 271 L480 285 Z" fill="#8FA8A0" stroke="#12291C" stroke-width="5" stroke-linejoin="round"/>
    <path d="M500 293 L506 272 L510 292 Z" fill="#8FA8A0" stroke="#12291C" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="474" cy="309" r="3.5" fill="#12291C"/>
    <circle cx="490" cy="309" r="3.5" fill="#12291C"/>
    <path d="M478 320 Q482 325, 486 320" stroke="#12291C" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M426 342 Q400 330, 404 306" stroke="#12291C" stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>

  <ellipse cx="300" cy="392" rx="250" ry="22" fill="#12291C"/>
</svg>
